<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İSG Sınav Hazırlık — Ders 1 & 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1d1b16;--mute:#6b665b;--line:#e2dccf;--acc:#e8590c;--ok:#2b8a3e;--okbg:#e6f4ea;--bad:#c92a2a;--badbg:#fdecec;--chip:#efe9dc}
@media (prefers-color-scheme:dark){:root{--bg:#16150f;--card:#1f1d17;--ink:#f1ede3;--mute:#a39d8f;--line:#35322a;--acc:#ff7a2e;--ok:#51cf66;--okbg:#1b2e1f;--bad:#ff6b6b;--badbg:#3a1d1d;--chip:#2a2820}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font:700 26px/1.1 "Space Grotesk",sans-serif;margin:0;letter-spacing:-.5px}
h1 span{color:var(--acc)}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.score{display:flex;gap:14px;font:600 14px "Space Grotesk",sans-serif}
.score b{font-size:22px;display:block;line-height:1}
.score .ok b{color:var(--ok)}.score .bad b{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.filters .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:999px;font:500 13px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.act{border-color:var(--acc);color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.meta{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.tag{font:600 11px Inter;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--mute)}
.tag.t-Yorum{background:#e7f0ff;color:#1c5fd4}.tag.t-Senaryo{background:#f3e8ff;color:#7b2fd0}.tag.t-Hesaplama{background:#fff1db;color:#b35c00}
@media (prefers-color-scheme:dark){.tag.t-Yorum{background:#1a2a44;color:#8ab4ff}.tag.t-Senaryo{background:#2c1d40;color:#c9a2ff}.tag.t-Hesaplama{background:#3a2a12;color:#ffc078}}
.qn{margin-left:auto;color:var(--mute);font:600 13px "Space Grotesk"}
.q{font-size:17px;font-weight:600;margin:0 0 16px;white-space:pre-line}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer;font:inherit;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--acc)}
.opt .l{flex:none;width:26px;height:26px;border-radius:7px;background:var(--chip);display:grid;place-items:center;font:700 13px "Space Grotesk"}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.exp{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:14px;display:none}
.exp.show{display:block}
.exp b{display:block;margin-bottom:3px}
.nav{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
.btn{border:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font:600 14px Inter;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px}
.grid button{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:600 12px "Space Grotesk";cursor:pointer;padding:0}
.grid button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.grid button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.grid button.cur{outline:2px solid var(--acc);outline-offset:1px}
.foot{color:var(--mute);font-size:12px;margin-top:18px;text-align:center}
.empty{padding:40px;text-align:center;color:var(--mute)}
.done{text-align:center;padding:10px 0}
.done h2{font:700 40px "Space Grotesk";margin:0}
kbd{font:600 11px "Space Grotesk";border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>İSG <span>Sınav</span> Hazırlık</h1><div class="sub">Ders 1: Temel İSG · Ders 2: Tarihsel Gelişim &amp; 6331</div></div>
  <div class="score"><div class="ok"><b id="sOk">0</b>doğru</div><div class="bad"><b id="sBad">0</b>yanlış</div><div><b id="sPct">–</b>başarı</div></div>
</header>
<div class="bar"><i id="prog" style="width:0"></i></div>
<div class="filters" id="filters"></div>
<div class="card" id="card"></div>
<div class="grid" id="grid"></div>
<div class="foot">Klavye: <kbd>A</kbd>–<kbd>D</kbd> veya <kbd>1</kbd>–<kbd>4</kbd> cevap · <kbd>←</kbd> <kbd>→</kbd> gezinme · Şıklar karıştırılır, Sıfırla ile yeniden karışır</div>
</div>
<script>
// Her sorunun doğru cevabı o[0]; şıklar sayfada karıştırılır.
const Q = [
// ===================== DERS 1 — TEMEL İSG =====================
{d:1,t:"Bilgi",q:"Uluslararası Çalışma Örgütü'ne (ILO) göre iş kazası nasıl tanımlanır?",
o:["Planlanmamış ve beklenmeyen bir olay sonucunda sakatlanmaya ve zarara neden olan durum","Çalışanın işyerinde geçirdiği her türlü sağlık sorunu","Yalnızca ölümle sonuçlanan işyeri olayları","İşverenin ihmalinden kaynaklanan maddi hasar"],
e:"ILO tanımının iki anahtar kelimesi: 'planlanmamış' ve 'beklenmeyen'. Ölüm şartı yok, işveren kusuru şartı da yok."},
{d:1,t:"Yorum",q:"\"İSG, kaza olduktan sonra konuyu ele alan değil, kaza olasılıklarını ortadan kaldırmaya yönelik çalışmalar yapan bir bilim dalıdır.\" ifadesi İSG'nin hangi temel yaklaşımını vurgular?",
o:["Önleyici (proaktif) yaklaşım","Tazmin edici yaklaşım","Cezalandırıcı yaklaşım","Tedavi edici (reaktif) yaklaşım"],
e:"Vurgu 'kaza olmadan önce' üzerinde. 6331'in de ilk temel yaklaşımı 'olmadan önle'dir."},
{d:1,t:"Bilgi",q:"İSG'nin hukuki açıdan tanımına göre, işçilerin karşılaştığı tehlikelerin giderilmesine ilişkin yükümlülükler esas olarak kime ve hangi hukuk temelinde getirilmiştir?",
o:["İşverene, kamu hukuku temelinde","Çalışana, özel hukuk temelinde","Sendikalara, iş hukuku temelinde","Devlete, ceza hukuku temelinde"],
e:"Hukuki tanım: yükümlülükler 'esas olarak işverene, kamu hukuku temelinde' getirilen kurallar bütünüdür."},
{d:1,t:"Bilgi",q:"ILO'nun modern İSG tanımına göre amaç, tüm mesleklerde çalışanların hangi yönlerden iyilik halinin en üst düzeyde tutulmasıdır?",
o:["Bedensel, ruhsal ve sosyal","Yalnızca bedensel","Bedensel ve ekonomik","Ruhsal ve hukuki"],
e:"Üçlü yapı: bedensel–ruhsal–sosyal. WHO'nun sağlık tanımıyla da paraleldir."},
{d:1,t:"Yorum",q:"Modern anlamda İSG tanımında, çalışanı korumanın yanında hangi iki amaç da açıkça yer alır?",
o:["Üretimin devamlılığını sağlamak ve verimliliği artırmak","Vergi yükünü azaltmak ve ihracatı artırmak","Sendikal hakları genişletmek ve ücretleri artırmak","Sigorta primlerini düşürmek ve maliyeti azaltmak"],
e:"Modern tanım İSG'yi sadece bir maliyet değil, üretim sürekliliği ve verimlilik aracı olarak görür."},
{d:1,t:"Bilgi",q:"İşyerlerinde bulunan sağlık risklerinin saptanması, ölçümlerinin yapılması ve bu risklerin ortadan kaldırılması için teknik düzenlemeler yapılmasına ne ad verilir?",
o:["İş hijyeni","İş güvenliği","Ergonomi","Sağlık gözetimi"],
e:"İş hijyeni = sapta → ölç → teknik düzenleme ile kaldır. Gürültü, toz ölçümü tipik örneklerdir."},
{d:1,t:"Senaryo",q:"Lumbal disk hernisi olan bir çalışan, elle yük taşıma işine verilmiş ve şikâyetleri ağırlaşarak akut ağrılı disk hernisine dönüşmüştür. Bu durum en doğru şekilde nasıl sınıflandırılır?",
o:["İşle ilgili hastalık","Meslek hastalığı","İş kazası","Kalıtsal hastalık"],
e:"Hastalık işten önce de vardı (temel etken işyeri dışında); iş onu ağırlaştırdı. Bu, işle ilgili hastalığın tam tanımıdır. Asıl hata: uygun işe yerleştirmenin yapılmaması."},
{d:1,t:"Yorum",q:"Meslek hastalığı ile işle ilgili hastalık arasındaki temel fark aşağıdakilerden hangisidir?",
o:["İşle ilgili hastalıklarda temel etken işyeri dışındadır; iş koşulları hastalığın seyrini ağırlaştırır","Meslek hastalıkları her zaman işle ilgili hastalıklardan daha sık görülür","İşle ilgili hastalıklar yalnızca kazalardan sonra ortaya çıkar","Meslek hastalıklarında çalışma ortamının hiçbir etkisi yoktur"],
e:"Meslek hastalığı doğrudan mesleki maruziyetten doğar; işle ilgili hastalıkta ise iş, mevcut veya çok faktörlü bir hastalığı kötüleştirir. Ayrıca işle ilgili hastalıklar daha SIK görülür."},
{d:1,t:"Bilgi",q:"Aşağıdakilerden hangisi notlarda 'işle ilgili hastalık' örnekleri arasında sayılmaz?",
o:["Kurşun zehirlenmesi","Kalp hastalıkları","Kronik obstrüktif akciğer hastalıkları","Kas-iskelet sistemi hastalıkları"],
e:"Kurşun zehirlenmesi doğrudan mesleki maruziyetle oluşan klasik bir meslek hastalığıdır. Diğerleri çok faktörlü, kronik-dejeneratif işle ilgili hastalıklardır."},
{d:1,t:"Bilgi",q:"Uygun işe yerleştirilmeme nedeniyle Avrupa Birliği'nde çalışanların yaklaşık ne kadarında sırt ağrısı problemi bulunmaktadır?",
o:["Her üç çalışandan birinde","Her on çalışandan birinde","Her iki çalışandan birinde","Her beş çalışandan birinde"],
e:"Notlardaki veri: AB'de her üç çalışandan birinde sırt ağrısı."},
{d:1,t:"Bilgi",q:"Dünya Sağlık Örgütü'ne göre işle ilgili hastalıkların kısa tanımı hangisidir?",
o:["Çalışma koşulları nedeniyle doğal seyri değişen hastalıklar","Yalnızca yasal listede yer alan hastalıklar","İşe girişte saptanan hastalıklar","Bulaşıcı olan mesleki hastalıklar"],
e:"WHO: çalışma ortamı ve şeklinin, diğer sebepler arasında önemli bir faktör olduğu hastalıklar — kısaca doğal seyri değişen hastalıklar."},
{d:1,t:"Yorum",q:"İş sağlığının amaçlarından \"yapılan iş ile işçi arasında uyumu sağlayarak asgari yorgunlukla optimal randıman elde etmek\" ifadesi günümüzde en çok hangi disiplinle ilişkilidir?",
o:["Ergonomi","Toksikoloji","Epidemiyoloji","Mikrobiyoloji"],
e:"İş–insan uyumu, yorgunluk ve verim dengesi ergonominin konusudur."},
{d:1,t:"Senaryo",q:"Bir işyerinde çalışanların sağlığını belirleyen etkenler sınıflandırılıyor. Aşağıdakilerden hangisi 'bireysel özellikler' grubunda yer alır?",
o:["Yaşam stili ve sigara-alkol alışkanlıkları","Gürültü ve titreşim","Ergonomik faktörler","Psikososyal faktörler"],
e:"Bireysel: yaş, cinsiyet, genetik, beslenme, alışkanlıklar, yaşam stili. Diğer şıklar işyeri ortam faktörleridir."},
{d:1,t:"Bilgi",q:"Aşağıdakilerden hangisi iş güvenliğinin dört temel amacından biri değildir?",
o:["İşletmenin pazar payını artırmak","Çalışanları korumak","Üretimin güvenliğini sağlamak","Ekolojik çevreye zarar vermemek"],
e:"Dört amaç: çalışanları korumak, üretim güvenliği, işletme güvenliği, ekolojik çevreyi korumak."},
{d:1,t:"Senaryo",q:"Bir fabrikada alınan tedbirlerle makinelerin arızalanarak devre dışı kalması, patlama ve yangın gibi işletmeyi tehlikeye düşürecek durumların ortadan kaldırılması hedefleniyor. Bu, iş güvenliğinin hangi amacına örnektir?",
o:["İşletme güvenliğini sağlamak","Üretim güvenliğini sağlamak","Ekolojik çevreyi korumak","Çalışanları korumak"],
e:"Makine arızası, patlama, yangın → işletmenin kendisinin güvenliği."},
{d:1,t:"Senaryo",q:"Bir gıda firması, ürettiği ürünlerin satışının sürekli olmasını ve ürünün çalışana ve topluma zarar vermeyecek şekilde muhafaza edilmesini hedefliyor. Bu hedef hangi kavramla ifade edilir?",
o:["Üretim güvenliği","İşletme güvenliği","İş hijyeni","İş güvenliği"],
e:"Notlardaki tanım birebir: üretim güvenliği = satışın devamlılığı + ürünün zararsız muhafazası."},
{d:1,t:"Senaryo",q:"Bir boya fabrikasının arıtılmamış atık suyunu derede bırakmasını önlemeye yönelik çalışma, iş güvenliğinin hangi amacıyla doğrudan ilgilidir?",
o:["Ekolojik çevreyi korumak","İşletme güvenliğini sağlamak","Üretim güvenliğini sağlamak","Uygun işe yerleştirme"],
e:"İşletme çıktılarının doğal çevreye aktarılmasını önlemek → ekolojik çevreyi koruma."},
{d:1,t:"Bilgi",q:"Aşağıdakilerden hangisi İSG'nin temel ilkeleri arasında yer almaz?",
o:["Üretim kotalarının artırılması","Uygun işe yerleştirme","Aralıklı kontrol muayeneleri","Sağlık eğitimi"],
e:"6 temel ilke: uygun işe yerleştirme, risklerin saptanması, risklerin kontrolü, aralıklı kontrol muayeneleri, sağlık hizmeti, sağlık eğitimi."},
{d:1,t:"Yorum",q:"Sistemli İSG çalışması yapmayan bir işletmenin karşılaşabileceği maliyetlerden hangisi en çok 'dolaylı/gizli maliyet' niteliğindedir?",
o:["Siparişlerin gecikmesi ve pazar kaybı","Yaralı işçinin hastane faturası","Mahkemenin hükmettiği tazminat","Kesilen idari para cezası"],
e:"Hastane, tazminat ve ceza doğrudan ölçülebilen giderlerdir. Sipariş gecikmesi, itibar ve pazar kaybı ise görünmeyen ama çoğu zaman daha büyük olan dolaylı maliyetlerdir."},
{d:1,t:"Bilgi",q:"İş kazası sonrası Sosyal Güvenlik Kurumu'nun, yaptığı harcamaları kusurlu işverenden geri istemek için açtığı dava türü hangisidir?",
o:["Rücu davası","İptal davası","Tespit davası","Men'i müdahale davası"],
e:"Notlarda maliyetler arasında 'SGK'nın rücu davalarına muhatap olunabilir' maddesi yer alır."},
{d:1,t:"Bilgi",q:"Çalışma hayatının sağlık alanındaki iki temel göstergesi hangileridir?",
o:["İş kazaları ve meslek hastalıkları","İşsizlik oranı ve ücret düzeyi","Sendikalaşma oranı ve grev sayısı","Devamsızlık ve fazla mesai"],
e:"İki gösterge: iş kazaları ve meslek hastalıkları. Nedenleri de ikiye ayrılır: tehlikeli davranış ve tehlikeli durum."},
{d:1,t:"Bilgi",q:"6331 sayılı Kanun'a göre 'işyerinde var olan ya da dışarıdan gelebilecek, çalışanı veya işyerini etkileyebilecek zarar veya hasar verme potansiyeli' neyin tanımıdır?",
o:["Tehlike","Risk","Ramak kala","Kaza"],
e:"Tehlike = POTANSİYEL. Risk = o potansiyelin gerçekleşme İHTİMALİ."},
{d:1,t:"Senaryo",q:"Bir atölyede zemine yağ dökülmüştür. \"Bir çalışanın bu zeminde kayarak düşüp yaralanma ihtimali\" hangi kavramı ifade eder?",
o:["Risk","Tehlike","Meslek hastalığı","İş kazası"],
e:"Yağlı zemin = tehlike (zarar potansiyeli). Kayıp yaralanma OLASILIĞI = risk."},
{d:1,t:"Bilgi",q:"OHSAS 18001'e göre risk nasıl tanımlanır?",
o:["Tehlikeli bir olayın olasılığı ile meydana geldiğinde oluşturacağı sağlık bozulmasının ciddiyet derecesinin birleşimi","Yaralanmaya sebep olabilecek kaynak, durum veya işlem","Yalnızca ölümle sonuçlanan olayların sıklığı","İşyerinde kullanılan kimyasalların toplam miktarı"],
e:"OHSAS: Risk = Olasılık × Şiddet. İkinci şık OHSAS'ın TEHLİKE tanımıdır."},
{d:1,t:"Bilgi",q:"OHSAS 18001'e göre 'insanların yaralanması veya sağlığının bozulmasına sebep olabilecek kaynak, durum veya işlem' neyin tanımıdır?",
o:["Tehlike","Risk","Kaza","Olay"],
e:"OHSAS'ta tehlike: kaynak, durum veya işlem."},
{d:1,t:"Bilgi",q:"Türkiye'de en yaygın şekilde benimsenen ve uygulanan iş sağlığı ve güvenliği yönetim sistemi hangisidir?",
o:["TS OHSAS 18001","ISO 9001","ISO 14001","HACCP"],
e:"ISO 9001 kalite, ISO 14001 çevre, HACCP gıda güvenliği yönetim sistemidir."},
{d:1,t:"Senaryo",q:"Bir çalışan, presin bıçağına sıkışan parçayı makineyi durdurmadan çıkarmaya çalışıyor. Bu, iş kazası nedenlerinden hangisine örnektir?",
o:["Tehlikeli davranış","Tehlikeli durum","Kaçınılmaz durum","Organizasyon kaynaklı tehlikeli durum"],
e:"Çalışan makineyi durdurmadan bakım/ayar yapmak bir insan davranışıdır → tehlikeli davranış."},
{d:1,t:"Senaryo",q:"Bir depoda aydınlatmanın yetersiz olması ve makinelerin koruyucusuz bulunması iş kazası nedenlerinden hangisi kapsamındadır?",
o:["Tehlikeli durum","Tehlikeli davranış","Kişisel hata","Kaçınılmaz durum"],
e:"Çalışanın değil, ortamın/ekipmanın kusuru → tehlikeli durum."},
{d:1,t:"Senaryo",q:"Bir inşaatta çalışan baret takmadan çalışıyor; aynı iskelede korkuluk da eksik. Bu iki durum sırasıyla nasıl sınıflandırılır?",
o:["Tehlikeli davranış – Tehlikeli durum","Tehlikeli durum – Tehlikeli davranış","İkisi de tehlikeli davranış","İkisi de tehlikeli durum"],
e:"KKD'yi kullanmamak davranıştır; korkuluğun eksikliği ortamın durumudur. Kazaların çoğu ikisinin aynı anda bulunduğu yerde olur."},
{d:1,t:"Bilgi",q:"Aşağıdakilerden hangisi tehlikeli davranışların nedenleri arasında yer almaz?",
o:["Yetersiz aydınlatma","Yorgunluk","Eğitim, bilgi ve tecrübe eksikliği","Vardiya değişimine uyum sağlayamama"],
e:"Yetersiz aydınlatma bir tehlikeli DURUMDUR; davranışın nedeni değil, ortamın özelliğidir."},
{d:1,t:"Bilgi",q:"Aşağıdakilerden hangisi işyeri organizasyonundan kaynaklanan tehlikeli durumlardan biridir?",
o:["Yetki ve sorumlulukların belli olmaması","Kaygan zemin","Gürültü","Koruyucusuz makine"],
e:"Organizasyon kaynaklı: eğitim verilmemesi, teknik eleman yetersizliği, iş bölümü olmaması, yetki-sorumluluk belirsizliği, yönetim hataları, üçüncü şahısların etkisi."},
{d:1,t:"Bilgi",q:"Notlardaki sınıflamaya göre 'monoton çalışma ve aşırı iş yükü' hangi etken grubundadır?",

{d:1,t:"Bilgi",q:"Notlara göre ağır yaralanma veya ölümle sonuçlanan her kazanın temelinde kaç hafif yaralanma ve kaç yaralanmasız olay vardır?",

{d:1,t:"Senaryo",q:"Etkili olduğu görülen önlemler standart hale getiriliyor ve kalıcı bir denetleme sistemi kuruluyor. PUKÖ'nün hangi aşamasıdır?",

{d:2,t:"Bilgi",q:"Madenlerde görülen kurşun ve civa zehirlenmelerinden bahsettiği 'De Morbis Metallici' eseriyle ilk iş hekimliği kitabını yazan kimdir?",
o:["Paracelsus","Agricola","Ramazzini","Galen"],
e:"Paracelsus. Aynı eserde bugün pnömokonyoz denilen kronik akciğer hastalıklarını tanımladı."},
{d:2,t:"Yorum",q:"Paracelsus'un \"The dose makes the poison\" (Zehri yapan dozdur) sözü günümüz İSG uygulamalarında en çok hangi kavramın temelini oluşturur?",
o:["Kimyasallar için maruziyet sınır değerleri","Çalışan temsilcisi seçimi","Acil durum tahliye planı","İş güvenliği uzmanı belge sınıfları"],
e:"Bir maddenin zararlı olup olmaması miktara bağlıysa, 'güvenli seviye' tanımlanabilir. Bu fikir bugünkü ppm sınır değerlerinin temelidir."},
{d:2,t:"Yorum",q:"Paracelsus'un \"Meslek hastalıkları riskinin artması, endüstriyel gelişmenin gerekli ve birlikte olan sonucudur\" sözü neyi ifade eder?",
o:["Sanayileşme arttıkça mesleki risklerin de artacağını ve önlemin şart olduğunu","Endüstrinin hiçbir risk taşımadığını","Meslek hastalıklarının yalnızca tarımda görüldüğünü","Sanayileşmenin durdurulması gerektiğini"],
e:"Riski üretimin doğal yan ürünü olarak görür; sanayi büyüdükçe İSG'nin de büyümesi gerektiğini ima eder."},
{d:2,t:"Bilgi",q:"'İş sağlığının babası' ve ilk işyeri hekimi olarak kabul edilen kimdir?",
o:["Bernardino Ramazzini","Percival Pott","Paracelsus","Alice Hamilton"],
e:"Ramazzini, 1713'te 'De Morbis Artificum Diatriba' (Çalışanların Hastalıkları) ile meslek hastalıklarını sistematik olarak ele aldı."},
{d:2,t:"Senaryo",q:"Bugün bir hekimin muayenede hastaya \"Ne iş yapıyorsunuz?\" diye sorarak ayrıntılı çalışma öyküsü alması, hangi isme dayanan bir uygulamadır?",
o:["Ramazzini","Hipokrat","Galen","Agricola"],
e:"Ramazzini hastalara mesleklerini sorarak iş–hastalık ilişkisini sorgulayan ilk hekimdir."},
{d:2,t:"Bilgi",q:"'De Morbis Artificum Diatriba' adlı eser hangi yıl yayımlanmıştır?",
o:["1713","1775","1556","1832"],
e:"1713 — Ramazzini."},
{d:2,t:"Yorum",q:"Ramazzini'nin, iş ve işçi uyumunun çalışanın sağlığı ve iş verimi üzerindeki etkisine dair düşüncesi bugün hangi bilim dalının konusudur?",
o:["Ergonomi","Toksikoloji","Mineraloji","Epidemiyoloji"],
e:"Notlar: bugün ergonomi olarak ifade edilen düşünceyi ilk kez dile getirmiştir. Ayrıca çalışma koşulları iyileşirse verimin artacağını söylemiştir."},
{d:2,t:"Bilgi",q:"Notlara göre Sanayi Devrimi'ni başlatan buharın keşfi hangi yıldadır?",
o:["1761","1713","1788","1832"],
e:"1761 buharın keşfi → fabrikalar → tarımdan fabrikaya göç."},
{d:2,t:"Yorum",q:"Sanayi Devrimi'nin İSG tarihindeki asıl önemi nedir?",
o:["Kötü çalışma ve yaşam koşulları sonucu İSG'nin toplumsal bir sorun olarak gündeme gelmesi","İş kazalarının tamamen ortadan kalkması","Çocuk işçiliğinin hemen yasaklanması","Tarımsal üretimin artması"],
e:"Göç, sağlıksız barınma, uzun mesai, salgınlar, kazalar → İSG artık tek tek hekimlerin değil, toplumun ve yasa koyucunun konusu oldu."},
{d:2,t:"Bilgi",q:"1775 yılında baca temizleyicilerinde sık görülen skrotum kanserinin nedeninin yapılan iş olduğunu ortaya koyan kimdir?",
o:["Percival Pott","Thomas Percival","Robert Peel","Michel Sadler"],
e:"Percival Pott – ilk mesleki kanser tespiti. İsim benzerliğine dikkat: Thomas Percival başka biridir."},
{d:2,t:"Hesaplama",q:"Pott'un tespiti 1775'te yapılmış, bu kanserin nedeni olan 1,2 dibenz antrasen ise ilk kimyasal kanserojen olarak 1932'de tanımlanmıştır. Aradaki süre yaklaşık ne kadardır ve bu ne gösterir?",
o:["~150 yıl; gözleme dayalı tespit, bilimsel nedenin kanıtlanmasından çok önce önlem almayı mümkün kılar","~50 yıl; bilim gözlemden hızlı ilerler","~15 yıl; kanser kısa sürede anlaşılmıştır","~300 yıl; gözlemler önemsizdir"],
e:"1932 − 1775 = 157 ≈ 150 yıl. 1788'deki yasa da kimyasal neden bilinmeden, sadece gözleme dayanarak çıkarılmıştır."},
{d:2,t:"Bilgi",q:"Pott'un gözlemi üzerine 1788'de İngiltere'de çıkarılan 'Baca Temizleyenlerin ve Çıraklarının' yasasında en küçük çalışma yaşı kaç olarak belirlenmiştir?",
o:["8","10","12","14"],
e:"8 yaş. Ayrıca çırakların en az haftada bir kez yıkanması önerildi."},
{d:2,t:"Bilgi",q:"Günde 14 saat çalıştırılan 4–6 yaşındaki çocuklarla ilgili rapordan etkilenip 1832'de 'Çırakların Sağlığı ve Morali' yasasını çıkartan işveren ve parlamenter kimdir?",
o:["Sir Robert Peel","Michel Sadler","Robert Owen","Percival Pott"],
e:"Robert Peel – çalışma saatini 12 saatle sınırladı ve havalandırmayı öngördü."},
{d:2,t:"Bilgi",q:"1833'te yürürlüğe giren ve fabrikaların denetimi için müfettiş atanmasını zorunlu kılan 'Fabrikalar Yasası'nı getiren kimdir?",
o:["Michel Sadler","Robert Peel","Thomas Percival","Robert Owen"],
e:"Sadler: müfettiş zorunluluğu, 9 yaş altı çocuk yasağı, 18 yaş altına 12 saatten fazla çalışma yasağı."},
{d:2,t:"Senaryo",q:"1833 Fabrikalar Yasası'na göre, 1834 yılında İngiltere'de 8 yaşındaki bir çocuğun fabrikada çalıştırılması ve 16 yaşındaki bir gencin günde 13 saat çalıştırılması hakkında ne söylenebilir?",
o:["İkisi de yasaya aykırıdır","İkisi de yasaya uygundur","Yalnızca çocuğun çalıştırılması aykırıdır","Yalnızca gencin çalıştırılması aykırıdır"],
e:"9 yaş altı işe alınamaz (8 < 9) ve 18 yaş altı 12 saatten fazla çalıştırılamaz (13 > 12). İkisi de ihlal."},
{d:2,t:"Bilgi",q:"İngiltere'de 1842 yılında yapılan düzenleme ile maden ocaklarında kimlerin çalıştırılması yasaklanmıştır?",
o:["Kadınların ve 10 yaşından küçük çocukların","Yalnızca 18 yaş altı gençlerin","Yabancı işçilerin","Mahkûmların"],
e:"1842: kadınlar ve 10 yaş altı çocuklar madende çalıştırılamaz. 1844: işyeri hekimlerinin sorumlulukları genişletildi."},
{d:2,t:"Bilgi",q:"Çalışma sürelerini daha da azaltan ve iş müfettişliği yapısını oluşturan İngiliz yasası hangisidir?",
o:["1847 On Saat Yasası","1833 Fabrikalar Yasası","1788 Baca Temizleyicileri Yasası","1895 Bildirim Yasası"],
e:"1847 – On Saat Yasası."},
{d:2,t:"Yorum",q:"İngiltere'deki aşağıdaki düzenlemelerin kronolojik sırası hangisidir?\nI. Meslek hastalıklarının bildiriminin zorunlu hale getirilmesi\nII. Baca temizleyicileri yasası\nIII. On Saat Yasası\nIV. Fabrikalar Yasası",
o:["II – IV – III – I","IV – II – III – I","II – III – IV – I","I – II – IV – III"],
e:"1788 baca → 1833 Fabrikalar → 1847 On Saat → 1895 bildirim zorunluluğu."},
{d:2,t:"Bilgi",q:"İngiltere'de işe giriş muayenesi, aralıklı sağlık muayeneleri ve tehlikeli işler için özel muayenelerin yasal nitelik kazandığı yıl hangisidir?",
o:["1900","1847","1895","1919"],
e:"1900 – muayeneler, meslek hastalığı bildirimi, sakatlananlar için özel rapor."},
{d:2,t:"Yorum",q:"Yasal zorunluluk olmadan, 'vicdani refleks' göstererek kendi fabrikalarında çalışma sürelerini kısaltan ve küçük çocukları çalıştırmayan Robert Owen'ın tutumu günümüzde hangi kavrama en yakındır?",
o:["Kurumsal sosyal sorumluluk / gönüllü iyi uygulama","Yasal yükümlülük","İdari para cezası","İşin durdurulması"],
e:"Owen'ı diğerlerinden ayıran nokta, bunu yasa zorlamadan, işveren olarak gönüllü yapmasıdır."},
{d:2,t:"Bilgi",q:"1919'da Harvard Üniversitesi'nin ilk kadın öğretim üyesi olan, bakır madenlerinde silikoz ve civa zehirlenmeleri üzerine çalışan ABD'li isim kimdir?",
o:["Alice Hamilton","Florence Nightingale","Marie Curie","Rachel Carson"],
e:"Alice Hamilton hayatının 40 yılını mesleki zararlar araştırmasına adadı."},
{d:2,t:"Bilgi",q:"SSCB sağlık politikasının baş mimarlarından olan ve 1920'lerde koruyucu önlemlere odaklanan birçok araştırma merkezi kurduran isim kimdir?",
o:["Alexander Semashko","Michel Sadler","Robert Owen","Thomas Percival"],
e:"Semashko – Rusya/SSCB."},
{d:2,t:"Senaryo",q:"Türk hekim Muzaffer Aksoy'un benzen kullanan kundura üreticilerinde kanser sıklığı üzerine yayımladığı makale (1965) sonucunda ABD'de ne değişmiştir?",
o:["8 saatlik çalışmada izin verilen benzen maruziyeti 10 ppm'den 1 ppm'e düşürüldü","Benzen kullanımı tamamen serbest bırakıldı","Kundura üretimi yasaklandı","Benzen sınırı 1 ppm'den 10 ppm'e çıkarıldı"],
e:"Aksoy, ABD hükümetinin açtığı davaya birinci derece tanık olarak çağrıldı; sınır 10 → 1 ppm oldu. Bilimsel bir yayın doğrudan mevzuatı değiştirdi."},
{d:2,t:"Bilgi",q:"Notlardaki listeye göre İngiltere'den (1788) sonra İSG alanında ilk yasal düzenlemeyi yapan ülke hangisidir?",
o:["Almanya (1839)","Fransa (1841)","ABD (1877)","İsviçre (1840)"],
e:"Sıra: İngiltere 1788 → Almanya 1839 → İsviçre 1840 → Fransa 1841 → ABD 1877 → Rusya 1920."},
{d:2,t:"Bilgi",q:"Uluslararası Çalışma Örgütü (ILO) hangi yıl kurulmuştur ve Türkiye hangi yıl üye olmuştur?",
o:["1919 – 1932","1946 – 1950","1919 – 1923","1932 – 1946"],
e:"ILO 1919, merkez Cenevre. Türkiye 1932'de üye oldu."},
{d:2,t:"Bilgi",q:"Avrupa İş Sağlığı ve Güvenliği Ajansı (EU-OSHA) hangi yıl kurulmuştur ve merkezi neresidir?",
o:["1994 – Bilbao, İspanya","1946 – Cenevre, İsviçre","1919 – Paris, Fransa","2004 – Brüksel, Belçika"],
e:"EU-OSHA 1994, Bilbao. WHO ise 1946, Cenevre."},
{d:2,t:"Bilgi",q:"Osmanlı döneminde esnafın sosyal güvenliği ve çalışma düzeni hangi kurumlar aracılığıyla sağlanmaya çalışılmıştır?",
o:["Ahilik (Fütüvvetname), loncalar ve vakıflar","Sendikalar ve SGK","OSGB'ler","İş mahkemeleri"],
e:"Ahilik teşkilatının kurallar bütünü Fütüvvetname'dir; loncalar ve vakıflar da bu işlevi üstlenmiştir."},
{d:2,t:"Bilgi",q:"Çalışma koşulları, yatakhane, çalışma süresi ve ücret gibi sosyal hayatı düzenleyen ilk belgelerden biri kabul edilen 1869 tarihli düzenleme hangisidir?",
o:["Maaddin Nizamnamesi","Dilaver Paşa Nizamnamesi","Polis Nizamnamesi","Mecelle"],
e:"1869 Maaddin Nizamnamesi. Dilaver Paşa 1865, Polis Nizamnamesi 1820, Mecelle 1876."},
{d:2,t:"Senaryo",q:"Maaddin Nizamnamesi'ne göre, bir maden kazası işverenin kötü yönetimi ve gerekli önlemleri almaması nedeniyle meydana gelmişse, işveren mahkemenin hükmettiği tazminata ek olarak ne öder?",
o:["15–20 altın tutarında ek tazminat","Hiçbir ek ödeme yapmaz","İşçinin bir yıllık ücretini","Madeni devlete devreder"],
e:"Kusur varsa ek 15–20 altın. Ayrıca havzadaki her işveren diplomalı hekim çalıştırmak ve eczane bulundurmak zorundaydı."},
{d:2,t:"Yorum",q:"Maaddin Nizamnamesi'ndeki 'Havzada her işveren diplomalı bir hekim çalıştırmak ve eczane bulundurmak zorundadır' hükmü günümüzde hangi yükümlülüğün öncüsü sayılabilir?",
o:["İşyeri hekimi görevlendirme yükümlülüğü","Çalışan temsilcisi seçimi","Tahliye planı hazırlama","İSG KATİP bildirimi"],
e:"Bugün 6331'in 6. maddesi işverene işyeri hekimi görevlendirme yükümlülüğü getirir."},
{d:2,t:"Bilgi",q:"Osmanlı'da ilk medeni kanun olarak kabul edilen Mecelle hangi yıl yürürlüğe girmiştir?",
o:["1876","1869","1860","1921"],
e:"1876 Mecelle."},
{d:2,t:"Yorum",q:"Aşağıdaki düzenlemelerin kronolojik sırası hangisidir?\nI. 3008 sayılı İş Kanunu\nII. Maaddin Nizamnamesi\nIII. 1593 sayılı Umumi Hıfzıssıhha Kanunu\nIV. 151 sayılı Ereğli Havzai Fahmiyesi Kanunu",
o:["II – IV – III – I","IV – II – III – I","II – III – IV – I","II – IV – I – III"],
e:"1869 Maaddin → 1921 151 sayılı → 1930 1593 sayılı → 1936 3008 sayılı."},
{d:2,t:"Bilgi",q:"İSG hükümlerinin ilk kez yer aldığı Türkiye'nin ilk İş Kanunu hangisidir?",
o:["1936 tarihli 3008 sayılı İş Kanunu","1930 tarihli 1593 sayılı Kanun","2003 tarihli 4857 sayılı İş Kanunu","1921 tarihli 151 sayılı Kanun"],
e:"3008 sayılı İş Kanunu, 1936."},
{d:2,t:"Bilgi",q:"Cumhuriyetin ilk yıllarında, 1921'de çıkarılan ve maden işçilerinin haklarını düzenleyen kanun hangisidir?",
o:["151 sayılı Ereğli Havzai Fahmiyesi Maden Amelesinin Hukukuna Müteallik Kanun","1593 sayılı Umumi Hıfzıssıhha Kanunu","3008 sayılı İş Kanunu","Dilaver Paşa Nizamnamesi"],
e:"151 sayılı Kanun – 1921, Ereğli kömür havzası."},
{d:2,t:"Bilgi",q:"Aşağıdakilerden hangisi 6331 sayılı Kanun'un temel yaklaşımlarından biri değildir?",
o:["Kusur sonrası cezalandırma yaklaşımı","Önleyici yaklaşım (olmadan önle)","Güvenlik kültürü","Risk değerlendirmesi"],
e:"6331'in üç temel yaklaşımı: önleyici yaklaşım, güvenlik kültürü, risk değerlendirmesi."},
{d:2,t:"Bilgi",q:"6331 sayılı Kanun'un amaçları (Madde 1) arasında aşağıdakilerden hangisi yer almaz?",
o:["İşverenlerin vergi yükünü azaltmak","Mevzuattaki dağınıklığın giderilmesi","Kapsamın genişletilmesi","İşveren ve çalışanların görev, yetki ve sorumluluklarını düzenlemek"],
e:"Amaçlar: dağınıklığın giderilmesi, kapsamın genişletilmesi, bütüncül yapı, İSG'nin sağlanması ve iyileştirilmesi, tarafların yükümlülüklerinin düzenlenmesi."},
{d:2,t:"Senaryo",q:"Aşağıdakilerden hangisi 6331 sayılı Kanun'un kapsamı DIŞINDADIR?",
o:["Kendi nam ve hesabına tek başına çalışan bir serbest tamirci","Bir fabrikada staj yapan üniversite öğrencisi","Bir bakanlıkta çalışan memur","Tarım işletmesinde çalışan mevsimlik işçi"],
e:"İstisnalar: TSK, emniyet, afet müdahale ekipleri, ev hizmetleri, kendi nam ve hesabına tek başına çalışanlar. Stajyer, memur ve tarım işçisi kapsamdadır; sayı sınırı da yoktur."},
{d:2,t:"Bilgi",q:"6331 sayılı Kanun'un 3. maddesine göre, işveren adına hareket eden ve işin/işyerinin yönetiminde görev alan kişiler bu Kanun bakımından nasıl kabul edilir?",
o:["İşveren sayılır","Çalışan sayılır","Çalışan temsilcisi sayılır","Destek elemanı sayılır"],
e:"İşveren vekilleri 6331 uygulamasında işveren sayılır; sorumluluktan kaçamazlar."},
{d:2,t:"Bilgi",q:"6331'e göre 'teknik eleman' tanımına giren unvanlar hangileridir?",
o:["Teknik öğretmen, fizikçi, kimyager ve üniversitelerin İSG programı mezunları","Yalnızca makine mühendisleri","Hemşire ve ebeler","Avukat ve hâkimler"],
e:"Teknik eleman: teknik öğretmen, fizikçi, kimyager + üniversitelerin İSG programı mezunları."},
{d:2,t:"Senaryo",q:"Bir fabrikada muhasebe çalışanı olan Ayşe, asli görevinin yanında yangınla mücadele ve ilk yardım konularında özel olarak görevlendirilmiş ve eğitim almıştır. 6331'e göre Ayşe'nin bu rolü nedir?",
o:["Destek elemanı","Çalışan temsilcisi","İş güvenliği uzmanı","İşveren vekili"],
e:"Destek elemanı: asli görevi yanında önleme, koruma, tahliye, yangınla mücadele, ilk yardım vb. için özel görevlendirilen kişi. Çalışan temsilcisi ise çalışanları temsil eder."},
{d:2,t:"Bilgi",q:"Kamu kurumları, OSB'ler ve TTK'ya göre faaliyet gösteren şirketler tarafından işyerlerine İSG hizmeti sunmak üzere kurulan ve Bakanlıkça yetkilendirilen birim hangisidir?",
o:["Ortak Sağlık ve Güvenlik Birimi (OSGB)","İşyeri Sağlık ve Güvenlik Birimi","İSG Kurulu","Ulusal İSG Konseyi"],
e:"OSGB dışarıdan hizmet sunar; İşyeri Sağlık ve Güvenlik Birimi ise işyerinin kendi içinde kurulur."},
{d:2,t:"Bilgi",q:"6331'in 6. ve 7. maddeleri, kamu kurumları ile 50'den az çalışanı olan az tehlikeli işyerleri için hangi tarihte yürürlüğe girmiştir?",
o:["31.12.2024","30.06.2012","01.01.2020","31.12.2030"],
e:"Defalarca ertelenen tarih son kez ertelenmedi; 2025 itibarıyla bu işyerleri de yükümlü."},
{d:2,t:"Bilgi",q:"Notlardaki sonuç bölümüne göre az tehlikeli sınıftaki işyerleri, çalışanlarına kaç yılda bir kaç saat İSG eğitimi vermekle yükümlüdür?",
o:["3 yılda bir 8 saat","Her yıl 16 saat","5 yılda bir 4 saat","2 yılda bir 12 saat"],
e:"Az tehlikeli: 3 yılda bir, 8 saat."},
{d:2,t:"Senaryo",q:"Bir işveren, Bakanlıkça ilan edilen eğitimleri tamamlayarak İSG hizmetlerini kendisi yürütmek istiyor. 6. maddeye göre işveren hangi hizmeti kendisi yürütemez?",
o:["İşe giriş ve periyodik muayeneler ile tetkikler","Risk değerlendirmesi çalışmaları","Çalışanların bilgilendirilmesi","Acil durum planı hazırlığı"],
e:"İşveren eğitimini tamamlasa bile tıbbi muayene ve tetkikler hekimlik gerektirdiği için hariç tutulur."},
{d:2,t:"Yorum",q:"Kanun'un 7. maddesindeki Bakanlık desteği konusunda aşağıdakilerden hangisi doğrudur?",
o:["Kamu kurum ve kuruluşları Bakanlık desteğinden yararlanamaz","Kamu kurumları desteğin önceliklisidir","Tüm işyerleri koşulsuz destek alır","Destek yalnızca çok tehlikeli işyerlerine verilir"],
e:"Cumhurbaşkanı karar verirse 10'dan az çalışanı olan az tehlikeli işyerleri de yararlanabilir; kamu kurumları ise yararlanamaz."},
{d:2,t:"Senaryo",q:"Haftalık 45 saat çalışan bir işçiye, aynı hafta mesai dışında 4 saat İSG eğitimi veriliyor ve işveren eğitim ücretini işçinin maaşından kesmek istiyor. 6331'e göre doğru değerlendirme hangisidir?",
o:["Eğitim maliyeti çalışana yansıtılamaz; haftalık süreyi aşan 4 saat fazla çalışma sayılır","İşveren ücreti kesebilir; eğitim çalışma süresinden sayılmaz","Eğitim isteğe bağlıdır; işçi katılmayabilir","Eğitim süresi yıllık izinden düşülür"],
e:"Eğitimin maliyeti çalışana yansıtılamaz, süresi çalışma süresinden sayılır, haftalık süreyi aşarsa fazla çalışma olarak değerlendirilir."},
{d:2,t:"Bilgi",q:"Aşağıdakilerden hangisi İSG eğitiminin özellikle verilmesi gereken durumlardan biri değildir?",

let F={d:"all",t:"all",m:"all"},list=[],pos=0;
const types=["Bilgi","Yorum","Senaryo","Hesaplama"];
function buildList(){
  list=Q.map((q,i)=>i).filter(i=>{const q=Q[i];
    if(F.d!=="all"&&q.d!=F.d)return false;
    if(F.t!=="all"&&q.t!==F.t)return false;
    if(F.m==="wrong")return st.ans[i]!==undefined&&st.ans[i]!==0;
    if(F.m==="open")return st.ans[i]===undefined;
    return true});
  if(pos>=list.length)pos=Math.max(0,list.length-1);
}
function chip(label,on,fn,cls=""){const b=document.createElement("button");b.className="chip"+(on?" on":"")+(cls?" "+cls:"");b.textContent=label;b.onclick=fn;return b}
function sep(){const s=document.createElement("span");s.className="sep";return s}
function renderFilters(){
  const f=document.getElementById("filters");f.innerHTML="";
  const cnt=d=>Q.filter(q=>d==="all"||q.d==d).length;
  [["all","Tümü ("+Q.length+")"],[1,"Ders 1 ("+cnt(1)+")"],[2,"Ders 2 ("+cnt(2)+")"]].forEach(([v,l])=>f.append(chip(l,F.d==v,()=>{F.d=v;pos=0;go()})));
  f.append(sep());
  f.append(chip("Her tür",F.t==="all",()=>{F.t="all";pos=0;go()}));
  types.forEach(t=>f.append(chip(t,F.t===t,()=>{F.t=t;pos=0;go()})));
  f.append(sep());
  const wrongN=Object.keys(st.ans).filter(k=>st.ans[k]!==0).length;
  f.append(chip("Çözülmemiş",F.m==="open",()=>{F.m=F.m==="open"?"all":"open";pos=0;go()}));
  f.append(chip("Yanlışlarım ("+wrongN+")",F.m==="wrong",()=>{F.m=F.m==="wrong"?"all":"wrong";pos=0;go()},"act"));
  f.append(chip("Sıfırla",false,(ev)=>{
    if(f.dataset.c!=="1"){f.dataset.c="1";ev.target.textContent="Emin misin? Tekrar bas";setTimeout(()=>{f.dataset.c="";renderFilters()},2500);return}
    st={ans:{},order:{}};Q.forEach((q,i)=>{const o=[0,1,2,3];for(let k=3;k>0;k--){const j=Math.floor(Math.random()*(k+1));[o[k],o[j]]=[o[j],o[k]]}st.order[i]=o});save();F={d:"all",t:"all",m:"all"};pos=0;f.dataset.c="";go()}));
}
function renderScore(){
  const ks=Object.keys(st.ans),ok=ks.filter(k=>st.ans[k]===0).length,bad=ks.length-ok;
  sOk.textContent=ok;sBad.textContent=bad;sPct.textContent=ks.length?Math.round(ok*100/ks.length)+"%":"–";
  prog.style.width=(ks.length*100/Q.length)+"%";
}
function renderCard(){
  const c=document.getElementById("card");
  if(!list.length){c.innerHTML='<div class="empty">'+(F.m==="wrong"?"Bu filtrede yanlışın yok 👏":"Bu filtrede soru kalmadı.")+'</div>';return}
  const i=list[pos],q=Q[i],a=st.ans[i],done=a!==undefined;
  let h='<div class="meta"><span class="tag">Ders '+q.d+'</span><span class="tag t-'+q.t+'">'+q.t+'</span><span class="qn">'+(pos+1)+' / '+list.length+' · #'+(i+1)+'</span></div>';
  h+='<p class="q"></p>';
  st.order[i].forEach((oi,k)=>{let cls="";if(done){if(oi===0)cls="ok";else if(oi===a)cls="bad"}
    h+='<button class="opt '+cls+'" data-o="'+oi+'"'+(done?" disabled":"")+'><span class="l">'+L[k]+'</span><span class="t"></span></button>'});
  h+='<div class="exp'+(done?" show":"")+'"><b>'+(done?(a===0?"✓ Doğru":"✗ Yanlış — doğru cevap "+L[st.order[i].indexOf(0)]):"")+'</b><span class="e"></span></div>';
  h+='<div class="nav"><button class="btn ghost" id="prev"'+(pos===0?" disabled":"")+'>← Önceki</button><button class="btn" id="next"'+(pos>=list.length-1?" disabled":"")+'>Sonraki →</button></div>';
  c.innerHTML=h;
  c.querySelector(".q").textContent=q.q;
  c.querySelectorAll(".opt").forEach(b=>{b.querySelector(".t").textContent=q.o[+b.dataset.o];b.onclick=()=>answer(i,+b.dataset.o)});
  c.querySelector(".e").textContent=q.e;
  prev.onclick=()=>{pos--;go()};next.onclick=()=>{pos++;go()};
}
function renderGrid(){
  const g=document.getElementById("grid");g.innerHTML="";
  list.forEach((i,k)=>{const b=document.createElement("button");b.textContent=i+1;
    const a=st.ans[i];if(a!==undefined)b.className=a===0?"ok":"bad";if(k===pos)b.classList.add("cur");
    b.onclick=()=>{pos=k;go()};g.append(b)});
}
function answer(i,o){if(st.ans[i]!==undefined)return;st.ans[i]=o;save();renderScore();renderFilters();renderCard();renderGrid()}
function go(){buildList();renderFilters();renderScore();renderCard();renderGrid();window.scrollTo({top:0,behavior:"smooth"})}
document.addEventListener("keydown",e=>{
  if(!list.length||e.ctrlKey||e.metaKey||e.altKey)return;const i=list[pos];
  const k=e.key.toUpperCase();let idx="1234".indexOf(k);if(idx<0)idx=L.indexOf(k);
  if(idx>=0&&e.key.length===1){answer(i,st.order[i][idx]);return}
  if(e.key==="ArrowRight"&&pos<list.length-1){pos++;go()}
  if(e.key==="ArrowLeft"&&pos>0){pos--;go()}
});
go();
</script>
</body>
